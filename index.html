<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW TBC Roster Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #ffb800;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h2 {
            color: #ffb800;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input, select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
        
        input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        button {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background: #ffb800;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #ffc933;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255,184,0,0.3);
        }
        
        .player-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .player-table th {
            background: rgba(255,184,0,0.2);
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #ffb800;
            font-weight: bold;
        }
        
        .player-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .player-table tr:hover {
            background: rgba(255,255,255,0.05);
        }
        
        .delete-btn {
            background: #e74c3c;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }
        
        .delete-btn:hover {
            background: #c0392b;
        }
        
        .class-warrior { color: #C79C6E; }
        .class-paladin { color: #F58CBA; }
        .class-hunter { color: #ABD473; }
        .class-rogue { color: #FFF569; }
        .class-priest { color: #FFFFFF; }
        .class-shaman { color: #0070DE; }
        .class-mage { color: #69CCF0; }
        .class-warlock { color: #9482C9; }
        .class-druid { color: #FF7D0A; }
        
        .role-tank { background: rgba(255,100,100,0.2); }
        .role-heal { background: rgba(100,255,100,0.2); }
        .role-dps { background: rgba(255,255,100,0.2); }
        
        .group-builder {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .group-box {
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 15px;
            border: 2px solid rgba(255,184,0,0.3);
        }
        
        .group-box h3 {
            color: #ffb800;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .group-slot {
            background: rgba(0,0,0,0.3);
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            min-height: 35px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .group-slot:hover {
            border-color: #ffb800;
            background: rgba(255,184,0,0.1);
        }
        
        .group-slot.filled {
            background: rgba(255,184,0,0.15);
        }
        
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #ffb800;
        }
        
        .stat-label {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ WoW TBC Classic Roster & Gruppen-Planer ⚔️</h1>
        
        <div class="section">
            <h2>➕ Spieler hinzufügen</h2>
            <div class="input-grid">
                <input type="text" id="playerName" placeholder="Spielername">
                <select id="playerClass">
                    <option value="">Klasse wählen</option>
                    <option value="Warrior">Warrior</option>
                    <option value="Paladin">Paladin</option>
                    <option value="Hunter">Hunter</option>
                    <option value="Rogue">Rogue</option>
                    <option value="Priest">Priest</option>
                    <option value="Shaman">Shaman</option>
                    <option value="Mage">Mage</option>
                    <option value="Warlock">Warlock</option>
                    <option value="Druid">Druid</option>
                </select>
                <select id="playerRole">
                    <option value="">Rolle wählen</option>
                    <option value="Tank">Tank</option>
                    <option value="Heal">Heal</option>
                    <option value="DPS">DPS</option>
                </select>
                <select id="playerType">
                    <option value="">Typ wählen</option>
                    <option value="Melee Cleave">Melee Cleave</option>
                    <option value="Spell Cleave">Spell Cleave</option>
                    <option value="Single Target">Single Target</option>
                </select>
                <button onclick="addPlayer()">Spieler hinzufügen</button>
            </div>
            
            <div class="stats" id="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalPlayers">0</div>
                    <div class="stat-label">Spieler</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalTanks">0</div>
                    <div class="stat-label">Tanks</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalHealers">0</div>
                    <div class="stat-label">Healer</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalDPS">0</div>
                    <div class="stat-label">DPS</div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>👥 Roster Übersicht</h2>
            <table class="player-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Klasse</th>
                        <th>Rolle</th>
                        <th>Typ</th>
                        <th>Aktion</th>
                    </tr>
                </thead>
                <tbody id="playerTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: rgba(255,255,255,0.5);">Noch keine Spieler hinzugefügt</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="section">
            <h2>🎯 Gruppen Builder (5er Gruppen)</h2>
            <div class="group-builder" id="groupBuilder">
                <!-- Groups will be generated here -->
            </div>
        </div>
    </div>

    <script>
        let players = [];
        let groups = [[], [], [], [], []]; // 5 Gruppen für einen 25er Raid
        
        function addPlayer() {
            const name = document.getElementById('playerName').value.trim();
            const playerClass = document.getElementById('playerClass').value;
            const role = document.getElementById('playerRole').value;
            const type = document.getElementById('playerType').value;
            
            if (!name || !playerClass || !role || !type) {
                alert('Bitte fülle alle Felder aus!');
                return;
            }
            
            players.push({ name, class: playerClass, role, type });
            
            // Clear inputs
            document.getElementById('playerName').value = '';
            document.getElementById('playerClass').value = '';
            document.getElementById('playerRole').value = '';
            document.getElementById('playerType').value = '';
            
            updateDisplay();
        }
        
        function deletePlayer(index) {
            if (confirm(`${players[index].name} wirklich löschen?`)) {
                // Remove from groups if assigned
                groups.forEach(group => {
                    const idx = group.findIndex(p => p.name === players[index].name);
                    if (idx !== -1) group.splice(idx, 1);
                });
                
                players.splice(index, 1);
                updateDisplay();
            }
        }
        
        function updateDisplay() {
            updateTable();
            updateStats();
            updateGroupBuilder();
        }
        
        function updateTable() {
            const tbody = document.getElementById('playerTableBody');
            
            if (players.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: rgba(255,255,255,0.5);">Noch keine Spieler hinzugefügt</td></tr>';
                return;
            }
            
            tbody.innerHTML = players.map((player, index) => `
                <tr>
                    <td>${player.name}</td>
                    <td class="class-${player.class.toLowerCase()}">${player.class}</td>
                    <td class="role-${player.role.toLowerCase()}">${player.role}</td>
                    <td>${player.type}</td>
                    <td><button class="delete-btn" onclick="deletePlayer(${index})">Löschen</button></td>
                </tr>
            `).join('');
        }
        
        function updateStats() {
            document.getElementById('totalPlayers').textContent = players.length;
            document.getElementById('totalTanks').textContent = players.filter(p => p.role === 'Tank').length;
            document.getElementById('totalHealers').textContent = players.filter(p => p.role === 'Heal').length;
            document.getElementById('totalDPS').textContent = players.filter(p => p.role === 'DPS').length;
        }
        
        function updateGroupBuilder() {
            const builder = document.getElementById('groupBuilder');
            builder.innerHTML = '';
            
            for (let i = 0; i < 5; i++) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group-box';
                groupDiv.innerHTML = `
                    <h3>Gruppe ${i + 1}</h3>
                    ${[0, 1, 2, 3, 4].map(slot => {
                        const player = groups[i][slot];
                        return `
                            <div class="group-slot ${player ? 'filled' : ''}" onclick="assignToGroup(${i}, ${slot})">
                                ${player ? `<span class="class-${player.class.toLowerCase()}">${player.name}</span> - ${player.role}` : 'Leer (klicken zum zuweisen)'}
                            </div>
                        `;
                    }).join('')}
                `;
                builder.appendChild(groupDiv);
            }
        }
        
        function assignToGroup(groupIndex, slotIndex) {
            const playerName = prompt('Spielername eingeben (oder leer lassen zum Entfernen):');
            
            if (playerName === null) return;
            
            if (playerName === '') {
                groups[groupIndex][slotIndex] = null;
                updateGroupBuilder();
                return;
            }
            
            const player = players.find(p => p.name.toLowerCase() === playerName.toLowerCase());
            
            if (!player) {
                alert('Spieler nicht gefunden!');
                return;
            }
            
            // Remove from other groups
            groups.forEach(group => {
                const idx = group.findIndex(p => p && p.name === player.name);
                if (idx !== -1) group[idx] = null;
            });
            
            groups[groupIndex][slotIndex] = player;
            updateGroupBuilder();
        }
        
        // Initialize
        updateDisplay();
    </script>
</body>
</html>
